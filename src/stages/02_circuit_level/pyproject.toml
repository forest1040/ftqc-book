[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ftqc-book-stage02"
version = "0.1.0"
description = "FTQC Book Stage 02: Circuit Level Extension Simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pymatching>=2.4.0",
    "qulacs>=0.6.13",
    "scipy>=1.17.1",
    "stim>=1.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ftqc"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
