[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ftqc-book-stage03"
version = "0.1.0"
description = "FTQC Book Stage 03: d=3 Integrated Simulator"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bloqade-tsim>=0.1.4",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pymatching>=2.4.0",
    "qulacs>=0.6.13",
    "scipy>=1.17.1",
    "stim>=1.16.0",
    "stimbposd>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ftqc"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
figures = [
    "svglib>=1.5.1",
    "reportlab>=4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
